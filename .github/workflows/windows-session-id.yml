name: Windows session ID build

on:
   push:
      branches: [feature/explicit-session-id]
   workflow_dispatch:

permissions:
   contents: read

concurrency:
   group: windows-session-id-${{ github.ref }}
   cancel-in-progress: true

jobs:
   build:
      name: Build Windows x64 executable
      runs-on: ubuntu-22.04
      timeout-minutes: 180
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3.0.0
         # Cold Bazel cross-builds need more space than the hosted image's
         # default free space; these SDKs are unused in this Linux job.
         - name: Free runner disk space
           run: |
              df -h /
              sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
              df -h /
         - run: bun install --frozen-lockfile
         # Build the same baseline addon and executable as the upstream release,
         # without relying on upstream's private runners or cached artifacts.
         - name: Build Windows native addon
           run: bun scripts/bazel-natives.ts win32-x64-baseline -- --config=ci --jobs=2
         - name: Build executable
           env:
              RELEASE_TARGETS: win32-x64
           run: bun run ci:release:build-binaries
         - name: Upload build for Windows verification
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: windows-build-unverified
              path: |
                 packages/coding-agent/binaries/omp-windows-x64.exe
                 packages/natives/native/pi_natives.win32-x64-baseline.node
              if-no-files-found: error
              retention-days: 1

   verify:
      name: Test on Windows x64
      needs: build
      runs-on: windows-2025
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: 1.4.4
         - run: bun install --frozen-lockfile
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: windows-build-unverified
              path: build
         - name: Install native addon for tests
           shell: pwsh
           run: Copy-Item build/natives/native/pi_natives.win32-x64-baseline.node packages/natives/native/
         - name: Run session and CLI regression tests
           run: bun test packages/coding-agent/test/session/session-explicit-id.test.ts packages/coding-agent/test/cli-session-id.test.ts
         - name: Smoke-test executable and session persistence
           shell: pwsh
           run: ./scripts/ci-windows-session-smoke.ps1 ./build/coding-agent/binaries/omp-windows-x64.exe
         - name: Calculate SHA-256
           shell: pwsh
           run: |
              $exe = 'build/coding-agent/binaries/omp-windows-x64.exe'
              $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
              "$hash  omp-windows-x64.exe" | Set-Content -Encoding ascii build/coding-agent/binaries/SHA256SUMS.txt
              Write-Host "SHA-256: $hash"
              "SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY
         - name: Upload verified Windows binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-windows-x64
              path: |
                 build/coding-agent/binaries/omp-windows-x64.exe
                 build/coding-agent/binaries/SHA256SUMS.txt
              if-no-files-found: error
